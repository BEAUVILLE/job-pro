tener("click",async e=>{const b=e.target.closest("[data-id][data-status]");if(!b)return;b.disabled=true;try{await DIGIY_JOBS_SECURE_API.updateCandidateStatus(b.dataset.id,b.dataset.status);candidates=candidates.map(c=>String(c.id)===String(b.dataset.id)?{...c,status:b.dataset.status}:c);render();status("Statut mis à jour par RPC.","ok")}catch(err){status("Erreur : "+err.message,"err")}})})();</script></body></html>
