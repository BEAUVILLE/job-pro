<!doctype html>
<html lang="fr" style="visibility:hidden"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PRO JOB — Mes matchs</title><script>window.DIGIY_MODULE="JOBS";window.DIGIY_LOGIN_URL="./pin.html";window.DIGIY_SUPABASE_URL="https://wesqmwjjtsefyjnluosj.supabase.co";window.DIGIY_SUPABASE_ANON_KEY="sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./guard.js?v=jobs-strict-20260716"></script><script src="./assets/js/jobs-secure-api-v4.js?v=20260722"></script><style>:root{--bg:#061b14;--ink:#ecfff4;--muted:#b8d5c4;--gold:#facc15;--green:#22c55e;--blue:#38bdf8;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:16px;background:linear-gradient(180deg,#0b2a1d,var(--bg));color:var(--ink);font-family:system-ui}.wrap{width:min(900px,100%);margin:auto}.shell,.card{border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.055)}.shell{padding:20px}.card{padding:15px;margin-top:11px}h1{font-size:clamp(36px,7vw,58px);margin:0 0 8px}.lead,.meta{color:var(--muted);font-weight:700}.row{display:flex;justify-content:space-between;gap:12px}.score{font-size:26px;color:#fde68a;font-weight:1000}.detail{margin-top:9px;white-space:pre-line;line-height:1.45}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{min-height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;padding:8px 11px;font-weight:900}.main{background:linear-gradient(135deg,var(--gold),var(--green));color:#061b14;border:0}.status{margin:12px 0;padding:11px;border:1px solid var(--line);border-radius:14px;font-weight:900}.ok{color:#bbf7d0}.err{color:#fecaca}</style></head><body><main class="wrap"><p><a href="./accueil.html" style="color:#fde68a">← Accueil PRO JOB</a></p><section class="shell"><h1>Rapprochements.</h1><p class="lead">DIGIY propose un score simple. Le recruteur garde la décision.</p><div id="status" class="status">Chargement…</div><div id="cards"></div></section></main><script>(async()=>{"use strict";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const low=v=>String(v||"").toLowerCase();let offers=[],candidates=[];const linked=c=>offers.find(o=>String(o.id)===String(c.offer_id))||offers[0]||null;function score(c,o){if(!o)return 35;let s=45;if(low(c.city)&&low(c.city)===low(o.city))s+=20;const ct=low([c.job_title,c.trade,c.message].join(" "));const ot=low([o.title,o.sector,o.description,o.requirements].join(" "));s+=Math.min(ct.split(/\s+/).filter(w=>w.length>4&&ot.includes(w)).length*8,25);return Math.min(98,s)}function render(){const rows=candidates.map(c=>{const o=linked(c);return{c,o,s:score(c,o)}}).sort((a,b)=>b.s-a.s);$("cards").innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="row"><div><b>${esc(x.c.full_name||"Candidat")}</b><div class="meta">${esc(x.c.trade||x.c.job_title||"Métier")} · ${esc(x.c.city||"Zone")}</div></div><span class="score">${x.s}%</span></div><div class="detail">Mission proposée : ${esc(x.o?.title||"À préciser")}\nVille : ${esc(x.o?.city||"À préciser")}</div><div class="actions"><button class="btn" data-id="${esc(x.c.id)}" data-status="shortlist">Sélection</button><button class="btn" data-id="${esc(x.c.id)}" data-status="call">À appeler</button><button class="btn main" data-id="${esc(x.c.id)}" data-status="accepted">Retenir</button></div></article>`).join(""):'<article class="card meta">Aucun rapprochement disponible.</article>'}try{const data=await DIGIY_JOBS_SECURE_API.loadAll();offers=data.offers;candidates=data.candidates;document.documentElement.style.visibility="";render();$("status").textContent=candidates.length+" profil(s) rapproché(s).";$("status").className="status ok"}catch(e){document.documentElement.style.visibility="";$("status").textContent="Erreur : "+e.message;$("status").className="status err"}$("cards").addEventListener("click",async e=>{const b=e.target.closest("[data-id][data-status]");if(!b)return;try{await DIGIY_JOBS_SECURE_API.updateCandidateStatus(b.dataset.id,b.dataset.status);candidates=candidates.map(c=>String(c.id)===String(b.dataset.id)?{...c,status:b.dataset.status}:c);render();$("status").textContent="Statut mis à jour par RPC.";$("status").className="status ok"}catch(err){$("status").textContent="Erreur : "+err.message;$("status").className="status err"}})})();</script></body></html>
