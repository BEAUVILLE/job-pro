<style>
:root{--bg:#1e293b;--bg2:#334155;--line:rgba(148,163,184,.20);--ink:#f9fafb;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100dvh;display:grid;place-items:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(ellipse 800px 500px at 15% -5%,rgba(250,204,21,.13),transparent 55%),radial-gradient(ellipse 700px 400px at 88% 5%,rgba(34,197,94,.10),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg))}.card{width:min(420px,100%);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:28px;padding:28px 24px 24px;box-shadow:0 28px 70px rgba(0,0,0,.55)}.header{text-align:center;margin-bottom:22px}.ico{font-size:38px;display:block;margin-bottom:10px}.badge{display:inline-flex;padding:5px 12px;border-radius:999px;border:1px solid rgba(250,204,21,.30);background:rgba(250,204,21,.08);color:#fde68a;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}.title{font-size:1.3rem;font-weight:1000}.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 22px}.step{display:flex;flex-direction:column;align-items:center;gap:4px}.dotstep{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:1000;color:var(--muted)}.dotstep.active{border-color:var(--gold);background:rgba(250,204,21,.12);color:var(--gold)}.dotstep.done{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}.connector{width:32px;height:2px;background:var(--line);margin-bottom:14px}.connector.done{background:var(--green)}.panel{display:none}.panel.active{display:block}.label{display:block;font-size:.78rem;font-weight:950;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.phone{position:relative}.flag{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}.input{width:100%;padding:14px 15px 14px 42px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);font-size:1.05rem;font-weight:900;outline:none}.input:focus{border-color:rgba(250,204,21,.50);box-shadow:0 0 0 3px rgba(250,204,21,.09)}.recap{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:12px;border:1px solid rgba(34,197,94,.25);background:rgba(34,197,94,.06);margin-bottom:18px}.recap button{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:900}.pinDots{display:flex;justify-content:center;gap:16px;margin:8px 0 20px}.pinDot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(148,163,184,.30)}.pinDot.filled{background:var(--gold);border-color:var(--gold)}.pinDot.err{border-color:var(--red);background:rgba(239,68,68,.2)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.key{border:1px solid rgba(148,163,184,.18);border-radius:14px;background:rgba(255,255,255,.04);color:var(--ink);font-size:1.3rem;font-weight:1000;min-height:58px}.key:active{transform:scale(.94);background:rgba(250,204,21,.12)}.key.zero{grid-column:2}.btn{width:100%;min-height:52px;border-radius:16px;border:1px solid rgba(250,204,21,.35);background:linear-gradient(135deg,rgba(250,204,21,.22),rgba(34,197,94,.18));color:#fff;font-size:1rem;font-weight:1000}.btn:disabled{opacity:.40}.status{margin-top:12px;padding:0;border-radius:12px;font-size:.84rem;font-weight:900;line-height:1.5;display:none;white-space:pre-wrap}.status.show{display:block;padding:10px 13px}.status.err{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.30);color:#fca5a5}.status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.30);color:#86efac}.status.spin{background:rgba(148,163,184,.07);border:1px solid var(--line);color:var(--muted)}.note{margin-top:18px;text-align:center;color:rgba(148,163,184,.58);font-size:.74rem;font-weight:800;line-height:1.55}

<body>
<div class="card">
<div class="header"><span class="ico">💼</span><div class="badge">🔑 Accès recruteur DIGIY</div><div class="title">PRO JOB</div></div>
<div class="steps"><div class="step"><div class="dotstep active" id="s1">1</div><small>Numéro</small></div><div class="connector" id="conn"></div><div class="step"><div class="dotstep" id="s2">2</div><small>Code</small></div></div>
<div class="panel active" id="p1"><label class="label" for="phone">Ton numéro de téléphone</label><div class="phone"><span class="flag">🇸🇳</span><input id="phone" class="input" type="tel" inputmode="numeric" placeholder="221 77 XXX XX XX" autocomplete="off" maxlength="15"></div><div class="status" id="st1"></div><button class="btn" id="next" type="button" style="margin-top:16px" disabled>Continuer →</button></div>
<div class="panel" id="p2"><div class="recap"><span id="phoneDisplay"></span><button id="back" type="button">Modifier</button></div><label class="label">Ton code secret</label><div class="pinDots" id="pinDots"><i class="pinDot"></i><i class="pinDot"></i><i class="pinDot"></i><i class="pinDot"></i></div><div class="keypad" id="keypad"><button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key zero" data-v="0">0</button><button class="key" data-v="DEL">⌫</button></div><button class="btn" id="enter" type="button" disabled>Ouvrir PRO JOB →</button><div class="status" id="st2"></div></div>
<div class="note">Ton numéro et ton code ne sont jamais partagés.<br>Session sécurisée pendant 8 heures.</div>
</div>
<script>
(()=>{"use strict";const MODULE="JOBS",INDEX_URL="./accueil.html",MAX_AGE=8*60*60*1000;const $=id=>document.getElementById(id);const phone=$("phone"),next=$("next"),enter=$("enter");let pin="",confirmed="",busy=false;const norm=v=>String(v||"").replace(/\D/g,"");const show=(id,msg,cls)=>{const e=$(id);e.className="status show "+cls;e.textContent=msg};const clear=id=>{$(id).className="status";$(id).textContent=""};const setStore=(k,v)=>{try{localStorage.setItem(k,v);sessionStorage.setItem(k,v)}catch(_){}};function client(){if(!window.supabase?.createClient)throw new Error("Librairie Supabase absente");return window._jobsSb||(window._jobsSb=window.supabase.createClient(window.DIGIY_SUPABASE_URL,window.DIGIY_SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}))}function dots(err=false){document.querySelectorAll(".pinDot").forEach((d,i)=>{d.classList.toggle("filled",i<pin.length);d.classList.toggle("err",err)});enter.disabled=pin.length!==4||busy}phone.addEventListener("input",()=>{clear("st1");next.disabled=norm(phone.value).length<9});next.onclick=()=>{confirmed=norm(phone.value);if(confirmed.length<9){show("st1","Numéro trop court.","err");return}$("p1").classList.remove("active");$("p2").classList.add("active");$("s1").className="dotstep done";$("s1").textContent="✓";$("s2").className="dotstep active";$("conn").classList.add("done");$("phoneDisplay").textContent=confirmed;pin="";dots()};$("back").onclick=()=>{busy=false;$("p2").classList.remove("active");$("p1").classList.add("active");$("s1").className="dotstep active";$("s1").textContent="1";$("s2").className="dotstep";$("conn").classList.remove("done");pin="";dots()};$("keypad").onclick=e=>{const k=e.target.closest("[data-v]");if(!k||busy)return;pin=k.dataset.v==="DEL"?pin.slice(0,-1):pin.length<4?pin+k.dataset.v:pin;clear("st2");dots();if(pin.length===4)setTimeout(login,120)};enter.onclick=login;async function login(){if(pin.length!==4||busy)return;busy=true;dots();show("st2","Vérification du code…","spin");try{const{data,error}=await client().rpc("digiy_verify_pin",{p_phone:confirmed,p_module:MODULE,p_pin:pin});if(error)throw new Error(error.message||"Erreur serveur");const row=Array.isArray(data)?data[0]:data;const ok=row===true||row?.ok===true||row?.access===true||row?.status==="ok";if(!ok){pin="";busy=false;dots(true);show("st2","Code incorrect.","err");return}const slug=row?.slug||row?.identifiant||("jobs-"+confirmed);const now=Date.now();const session=JSON.stringify({slug,phone:confirmed,module:MODULE,module_label:"PRO JOB",validated_at:now,expires_at:now+MAX_AGE,session_token:row?.session_token||"",ok:true,verified:true,access:true,access_ok:true,source:"pin.html"});["digiy_jobs_session","digiy_jobs_guard_session","digiy_guard_jobs_session"].forEach(k=>setStore(k,session));["digiy_jobs_phone","digiy_jobs_last_phone","digiy_phone"].forEach(k=>setStore(k,confirmed));["digiy_jobs_last_slug","digiy_jobs_slug","digiy_last_slug","digiy_slug"].forEach(k=>setStore(k,slug));show("st2","PRO JOB ouvert. Redirection…","ok");const u=new URL(INDEX_URL,location.href);u.searchParams.set("slug",slug);setTimeout(()=>location.replace(u.toString()),650)}catch(err){busy=false;pin="";dots();show("st2","Erreur : "+(err?.message||"inattendue"),"err")}}})();
</script>
