<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071711" />
  <title>DIGIY JOBS PRO — Accès PIN</title>

  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE = "JOBS";
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#071711;
      --card:#0b2a1f;
      --text:#f9fafb;
      --muted:#cbd5e1;
      --gold:#d4af37;
      --green:#22c55e;
      --red:#ef4444;
      --radius:20px;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#071711,#020617);
      color:var(--text);
      font-family:system-ui;
    }

    .box{
      width:100%;
      max-width:420px;
      padding:20px;
      border-radius:var(--radius);
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }

    h1{
      margin:0 0 10px;
      font-size:1.2rem;
    }

    p{
      margin:0 0 16px;
      color:var(--muted);
      font-size:.9rem;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);
      color:#fff;
      font-size:1rem;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      font-weight:700;
      cursor:pointer;
      background:linear-gradient(135deg,var(--gold),#facc15);
      color:#000;
    }

    .status{
      margin-top:10px;
      font-size:.9rem;
      color:var(--muted);
    }

    .ok{color:var(--green)}
    .err{color:var(--red)}
  </style>
</head>

<body>
  <div class="box">
    <h1>💼 DIGIY JOBS PRO</h1>
    <p>Accès rapide avec ton téléphone + PIN</p>

    <input id="slug" placeholder="jobs-221771342889" />
    <input id="phone" placeholder="221771342889" />
    <input id="pin" type="password" placeholder="••••" />

    <button id="go">🔓 Ouvrir mon espace JOBS</button>

    <div id="status" class="status">Prêt.</div>
  </div>

<script>
(() => {
  const MODULE = "JOBS";
  const SESSION_KEY = "DIGIY_JOBS_SESSION";
  const HOURS = 8;

  const supabase = window.supabase.createClient(
    window.DIGIY_SUPABASE_URL,
    window.DIGIY_SUPABASE_ANON
  );

  const el = {
    slug: document.getElementById("slug"),
    phone: document.getElementById("phone"),
    pin: document.getElementById("pin"),
    go: document.getElementById("go"),
    status: document.getElementById("status")
  };

  function setStatus(msg, type=""){
    el.status.className = "status " + type;
    el.status.textContent = msg;
  }

  function norm(v){
    return String(v||"").replace(/\s+/g,"").trim();
  }

  function saveSession(s){
    localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  }

  async function resolvePhone(slug){
    const {data} = await supabase
      .from("digiy_subscriptions_public")
      .select("phone")
      .eq("slug", slug)
      .single();

    return data?.phone || null;
  }

  async function login(){
    let slug = norm(el.slug.value);
    let phone = norm(el.phone.value);
    let pin = norm(el.pin.value);

    if(!slug && !phone){
      setStatus("Slug ou téléphone requis","err");
      return;
    }

    if(!pin){
      setStatus("PIN requis","err");
      return;
    }

    setStatus("Vérification...");

    if(!phone && slug){
      phone = await resolvePhone(slug);
      if(!phone){
        setStatus("Slug inconnu","err");
        return;
      }
    }

    const {data} = await supabase.rpc("digiy_verify_pin",{
      p_phone: phone,
      p_module: MODULE,
      p_pin: pin
    });

    if(!data?.ok){
      setStatus("PIN refusé","err");
      return;
    }

    const session = {
      slug: data.slug,
      phone: data.phone,
      module: MODULE,
      validated_at: new Date().toISOString(),
      expires_at: new Date(Date.now()+HOURS*3600000).toISOString()
    };

    saveSession(session);

    setStatus("Accès OK → ouverture cockpit","ok");

    setTimeout(()=>{
      window.location.href = "./cockpit.html?slug="+session.slug;
    },200);
  }

  el.go.onclick = login;

})();
</script>
</body>
</html>
