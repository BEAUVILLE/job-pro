<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#061b14"/>
  <meta
    name="description"
    content="DIGIY JOBS PRO — entrée PIN sécurisée pour ouvrir le cockpit recruteur."
  />
  <title>DIGIY JOBS PRO — Entrée PIN</title>

  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE = "JOBS";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#061b14;
      --card:#0b2a1f;
      --line:rgba(255,255,255,.14);
      --text:#eafff1;
      --muted:rgba(234,255,241,.72);
      --gold:#facc15;
      --ok:#22c55e;
      --bad:#fb7185;
      --shadow:0 18px 55px rgba(0,0,0,.45);
      --r:18px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top, rgba(250,204,21,.10), transparent 55%),
        linear-gradient(135deg,#04160f,#0a2b1f);
      color:var(--text);
      padding:18px;
    }

    .card{
      width:min(520px,92vw);
      background:linear-gradient(145deg,rgba(11,42,31,.96),rgba(6,35,25,.96));
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .ico{
      width:46px;
      height:46px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at 30% 0,var(--gold),transparent 60%);
      color:#062015;
      font-weight:1000;
      border:1px solid rgba(250,204,21,.35);
    }

    .t{
      font-weight:1000;
      letter-spacing:.12em;
      font-size:12px;
      text-transform:uppercase;
    }

    .sub{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
      line-height:1.45;
    }

    .pill{
      border:1px solid var(--line);
      background:rgba(250,204,21,.10);
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
    }

    .sep{
      height:1px;
      background:var(--line);
      margin:14px 0;
    }

    .mini{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }

    .mini b{
      color:var(--text);
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin:12px 0 6px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:900;
    }

    input{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.22);
      color:var(--text);
      font-size:16px;
      font-weight:900;
      letter-spacing:.14em;
      outline:none;
    }

    input:focus{
      border-color:rgba(250,204,21,.35);
      box-shadow:0 0 0 4px rgba(250,204,21,.08);
    }

    button{
      width:100%;
      margin-top:12px;
      padding:14px 14px;
      border-radius:14px;
      border:none;
      background:linear-gradient(90deg,var(--ok),var(--gold));
      color:#062015;
      font-weight:1000;
      font-size:15px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .row{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }

    .link-btn{
      flex:1 1 180px;
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:var(--text);
      text-decoration:none;
      font-weight:900;
      font-size:14px;
    }

    .msg{
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
      line-height:1.6;
      min-height:20px;
    }

    .ok{
      color:var(--ok);
      font-weight:900;
    }

    .bad{
      color:var(--bad);
      font-weight:900;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <div class="ico">🦅</div>
        <div>
          <div class="t" id="title">DIGIY JOBS PRO — PORTE PIN</div>
          <div class="sub" id="subtitle">Chargement…</div>
        </div>
      </div>
      <div class="pill" id="modPill">JOBS</div>
    </div>

    <div class="sep"></div>

    <div class="mini">
      SLUG : <b id="slugBox">—</b>
    </div>

    <label for="pin">Entre ton PIN</label>
    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="••••"
      maxlength="8"
    />

    <button id="go" type="button">🚀 OUVRIR LE COCKPIT</button>

    <div class="row">
      <a class="link-btn" id="publicBtn" href="./" rel="noopener">Mur public</a>
      <a class="link-btn" href="https://digiylyfe.com/" target="_blank" rel="noopener">Site DIGIY</a>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    (async () => {
      const MODULE_CODE = "JOBS";
      const MODULE_LABEL = "DIGIY JOBS PRO";
      const DEFAULT_NEXT_URL = "cockpit.html";

      const $ = (id) => document.getElementById(id);
      const msg = (html) => { $("msg").innerHTML = html; };

      function safeSlug(v = "") {
        return String(v || "").trim().toLowerCase();
      }

      function safePhone(v = "") {
        return String(v || "").replace(/[^\d+]/g, "");
      }

      function safeNextPath(v = "") {
        const raw = String(v || "").trim();
        if (!raw) return DEFAULT_NEXT_URL;
        if (/^[a-zA-Z0-9._/-]+\.html$/.test(raw)) return raw;
        return DEFAULT_NEXT_URL;
      }

      function saveSessions(payload){
        const session = {
          slug: payload.slug || currentSlug,
          phone: payload.phone || null,
          owner_id: payload.owner_id || null,
          module: MODULE_CODE,
          access: true,
          ts: Date.now()
        };

        try{
          localStorage.setItem("DIGIY_ACCESS", JSON.stringify({
            slug: session.slug,
            phone: session.phone,
            owner_id: session.owner_id,
            module: MODULE_CODE,
            access: true,
            ts: session.ts
          }));
        }catch(_){}

        try{
          localStorage.setItem("DIGIY_SESSION_JOBS", JSON.stringify(session));
        }catch(_){}

        try{
          localStorage.setItem("digiy_jobs_session", JSON.stringify(session));
        }catch(_){}
      }

      $("modPill").textContent = MODULE_CODE;
      $("title").textContent = MODULE_LABEL + " — PORTE PIN";

      const url = new URL(location.href);
      const currentSlug = safeSlug(url.searchParams.get("slug"));
      const nextPath = safeNextPath(url.searchParams.get("next"));
      const publicBtn = $("publicBtn");

      if (publicBtn) {
        publicBtn.href = currentSlug
          ? `./?slug=${encodeURIComponent(currentSlug)}`
          : "./";
      }

      $("slugBox").textContent = currentSlug || "—";
      $("subtitle").textContent = currentSlug
        ? "Entrée pro sécurisée — PIN requis"
        : "Slug manquant";

      const supa = window.supabase;
      const supabaseUrl = window.DIGIY_SUPABASE_URL;
      const supabaseKey = window.DIGIY_SUPABASE_ANON || window.DIGIY_SUPABASE_ANON_KEY;

      if (!supa || !supabaseUrl || !supabaseKey) {
        msg(`<span class="bad">❌ Supabase non chargé.</span><br>Vérifie la configuration front.`);
        $("go").disabled = true;
        return;
      }

      const sb = supa.createClient(supabaseUrl, supabaseKey);

      if (!currentSlug) {
        msg(`<span class="bad">❌ SLUG manquant.</span><br>Reviens depuis le mur public JOBS ou l’entrée pro avec un lien contenant <b>?slug=jobs-...</b>.`);
        $("go").disabled = true;
        return;
      }

      setTimeout(() => $("pin")?.focus(), 150);

      async function enter(){
        const pin = $("pin").value.trim();

        if (pin.length < 3) {
          msg(`<span class="bad">❌ PIN invalide.</span>`);
          return;
        }

        $("go").disabled = true;
        msg(`Vérification en cours…`);

        const { data, error } = await sb.rpc("digiy_verify_access", {
          p_slug: currentSlug,
          p_pin: pin,
          p_module: MODULE_CODE
        });

        if (error) {
          console.error(error);
          $("go").disabled = false;
          msg(`<span class="bad">❌ Erreur.</span><br>${String(error.message || error)}`);
          return;
        }

        if (!data?.ok) {
          $("go").disabled = false;

          if (data?.reason === "module_inactive") {
            msg(
              `<span class="bad">🔒 Module non actif.</span><br>` +
              `Le module JOBS n’est pas encore activé pour ce pro.` +
              `<br><span style="opacity:.85">Modules actifs : ${(data.modules_active || []).join(", ") || "—"}</span>`
            );
            return;
          }

          msg(`<span class="bad">❌ Accès refusé.</span><br>PIN incorrect ou accès JOBS non valide.`);
          return;
        }

        saveSessions(data);
        msg(`<span class="ok">✅ Accès validé.</span> Ouverture du cockpit…`);

        setTimeout(() => {
          const next = new URL(nextPath, location.href);
          next.searchParams.set("slug", data.slug || currentSlug);
          if (data.phone) next.searchParams.set("phone", safePhone(data.phone));
          location.href = next.toString();
        }, 420);
      }

      $("go").addEventListener("click", enter);
      $("pin").addEventListener("keydown", (e) => {
        if (e.key === "Enter") enter();
      });
    })();
  </script>
</body>
</html>
