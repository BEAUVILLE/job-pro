<style>body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#334155,#1e293b);color:#f9fafb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}main{width:min(420px,100%);padding:26px;border:1px solid rgba(250,204,21,.25);border-radius:28px;background:rgba(255,255,255,.04)}h1{margin:8px 0}p{color:#cbd5e1;font-weight:800}</style>

<body><main><div style="font-size:42px">💼</div><h1>PRO JOB</h1><p>Ouverture de la porte recruteur sécurisée…</p></main>
<script>
(async()=>{
  "use strict";
  const response=await fetch("./pin-core.html",{cache:"no-store"});
  if(!response.ok)throw new Error("Porte PIN indisponible");
  let html=await response.text();
  const patch=`<script>(()=>{\n"use strict";\nconst MAX=8*60*60*1000;\nconst sessionKeys=new Set(["digiy_jobs_session","digiy_jobs_guard_session","digiy_guard_jobs_session","DIGIY_JOBS_PIN_SESSION","DIGIY_JOBS_SESSION","DIGIY_JOBS_ACCESS"]);\nconst dropAll=new Set(["DIGIY_MASTER_PIN_SESSION","DIGIY_PIN_SESSION","DIGIY_ACCESS","DIGIY_SESSION","digiy_session","digiy_phone","digiy_last_phone","DIGIY_PHONE","DIGIY_LAST_PHONE","digiy_last_slug","digiy_slug"]);\nconst localOnlyDrop=new Set(["digiy_jobs_phone","digiy_jobs_last_phone","DIGIY_JOBS_HUB_PHONE","digiy_jobs_slug","digiy_jobs_last_slug"]);\nfor(const storage of [localStorage,sessionStorage]){for(const key of [...dropAll,...localOnlyDrop]){try{storage.removeItem(key)}catch(_){}}}\nconst original=Storage.prototype.setItem;\nStorage.prototype.setItem=function(key,value){const k=String(key);if(dropAll.has(k))return;if(this===localStorage&&localOnlyDrop.has(k))return;if(sessionKeys.has(k)){try{const o=JSON.parse(String(value));const now=Date.now();const verified=Number(o.verified_at||o.validated_at||o.ts||now);o.module="JOBS";o.access=true;o.access_ok=true;o.ok=true;o.verified=true;o.pin_session_ok=true;o.verified_at=verified;o.validated_at=new Date(verified).toISOString();o.expires_at=Math.min(Number(o.expires_at||verified+MAX),verified+MAX);o.source="pin.html";value=JSON.stringify(o)}catch(_){return}}return original.call(this,k,String(value))};\nconst set=URLSearchParams.prototype.set;URLSearchParams.prototype.set=function(k,v){if(["slug","phone","tel"].includes(String(k)))return this;return set.call(this,k,v)};\ntry{history.replaceState({},document.title,location.pathname)}catch(_){}\n})();<\/script>`;
  html=html.replace("</head>",patch+"</head>");
  document.open();document.write(html);document.close();
})().catch(()=>location.replace("./pin-core.html"));
</script>
</body>
</html>
