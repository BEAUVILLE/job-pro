name: Signer les cartes DIGIYLYFE.COM

on:
  push:
    paths:
      - '**/*carte*'
      - '**/*CARTE*'
      - '**/*card*'
      - '**/*CARD*'
      - '.github/workflows/sign-cards-digiylyfe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Ajouter la signature officielle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, PngImagePlugin
          import hashlib
          import json
          import re

          SIGNATURE = "DIGIYLYFE.COM"
          MANIFEST = Path('.digiy-card-signatures.json')
          RASTER = {'.png', '.jpg', '.jpeg', '.webp'}

          try:
              signed = json.loads(MANIFEST.read_text(encoding='utf-8')) if MANIFEST.exists() else {}
          except Exception:
              signed = {}

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def is_card(path: Path) -> bool:
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  return False
              name = path.name.lower()
              return ('carte' in name or 'card' in name) and path.suffix.lower() in (RASTER | {'.svg'})

          def font_for(size: int):
              candidates = [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',
                  '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf',
              ]
              for candidate in candidates:
                  if Path(candidate).exists():
                      return ImageFont.truetype(candidate, size)
              return ImageFont.load_default()

          def sign_raster(path: Path):
              with Image.open(path) as source:
                  source.load()
                  base = source.convert('RGBA')

              width, height = base.size
              band_h = max(72, int(height * 0.085))
              y0 = height - band_h
              overlay = Image.new('RGBA', base.size, (0, 0, 0, 0))
              draw = ImageDraw.Draw(overlay)
              draw.rectangle((0, y0, width, height), fill=(3, 24, 18, 228))
              line_h = max(3, int(height * 0.003))
              draw.rectangle((0, y0, width, y0 + line_h), fill=(244, 201, 93, 255))

              size = max(24, int(height * 0.032))
              font = font_for(size)
              while size > 18:
                  box = draw.textbbox((0, 0), SIGNATURE, font=font)
                  if box[2] - box[0] <= width * 0.84:
                      break
                  size -= 2
                  font = font_for(size)

              box = draw.textbbox((0, 0), SIGNATURE, font=font)
              tw, th = box[2] - box[0], box[3] - box[1]
              x = (width - tw) / 2
              y = y0 + (band_h - th) / 2 - box[1]
              draw.text((x, y), SIGNATURE, font=font, fill=(255, 232, 168, 255), stroke_width=max(1, size // 24), stroke_fill=(0, 0, 0, 180))

              out = Image.alpha_composite(base, overlay)
              suffix = path.suffix.lower()
              if suffix == '.png':
                  meta = PngImagePlugin.PngInfo()
                  meta.add_text('DIGIY_SIGNATURE', SIGNATURE)
                  out.save(path, format='PNG', optimize=True, pnginfo=meta)
              elif suffix in {'.jpg', '.jpeg'}:
                  out.convert('RGB').save(path, format='JPEG', quality=95, optimize=True)
              elif suffix == '.webp':
                  out.save(path, format='WEBP', quality=95, method=6)

          def parse_number(value, fallback):
              if value is None:
                  return fallback
              match = re.search(r'-?\d+(?:\.\d+)?', str(value))
              return float(match.group(0)) if match else fallback

          def has_visible_svg_signature(text: str) -> bool:
              return bool(
                  re.search(r'>\s*(?:BY\s+)?DIGIYLYFE\.COM\s*<', text, re.I)
                  or re.search(r'aria-label\s*=\s*["\'](?:BY\s+)?DIGIYLYFE\.COM["\']', text, re.I)
                  or re.search(r'id\s*=\s*["\']digiylyfe-com-signature["\']', text, re.I)
              )

          def sign_svg(path: Path):
              text = path.read_text(encoding='utf-8')
              if has_visible_svg_signature(text):
                  return

              viewbox = re.search(r'viewBox\s*=\s*["\']([^"\']+)["\']', text, re.I)
              if viewbox:
                  values = [float(v) for v in re.split(r'[ ,]+', viewbox.group(1).strip())]
                  x0, y0, width, height = values[:4]
              else:
                  width_match = re.search(r'width\s*=\s*["\']([^"\']+)["\']', text, re.I)
                  height_match = re.search(r'height\s*=\s*["\']([^"\']+)["\']', text, re.I)
                  x0 = y0 = 0
                  width = parse_number(width_match.group(1) if width_match else None, 1080)
                  height = parse_number(height_match.group(1) if height_match else None, 1920)

              band_h = max(54, height * 0.085)
              font_size = max(24, height * 0.032)
              band_y = y0 + height - band_h
              center_x = x0 + width / 2
              baseline = band_y + band_h * 0.63
              block = f'''\n<g id="digiylyfe-com-signature" aria-label="DIGIYLYFE.COM">\n  <rect x="{x0:g}" y="{band_y:g}" width="{width:g}" height="{band_h:g}" fill="#031812" fill-opacity="0.94"/>\n  <rect x="{x0:g}" y="{band_y:g}" width="{width:g}" height="{max(3, height * 0.003):g}" fill="#f4c95d"/>\n  <text x="{center_x:g}" y="{baseline:g}" text-anchor="middle" fill="#ffe8a8" font-family="Arial,Helvetica,sans-serif" font-size="{font_size:g}" font-weight="900" letter-spacing="{max(2, width * 0.003):g}">DIGIYLYFE.COM</text>\n</g>\n'''
              if '</svg>' not in text.lower():
                  raise ValueError(f'SVG invalide: {path}')
              pos = text.lower().rfind('</svg>')
              path.write_text(text[:pos] + block + text[pos:], encoding='utf-8')

          changed = []
          for path in sorted(Path('.').rglob('*')):
              if not is_card(path):
                  continue
              key = path.as_posix()
              before = digest(path)
              if signed.get(key) == before:
                  continue
              if path.suffix.lower() == '.svg':
                  sign_svg(path)
              else:
                  sign_raster(path)
              after = digest(path)
              signed[key] = after
              if after != before:
                  changed.append(key)

          MANIFEST.write_text(json.dumps(signed, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Cartes signees:', ', '.join(changed) if changed else 'aucune modification visuelle')
          PY

      - name: Commit et push
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucune carte a signer."
            exit 0
          fi
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Signer les cartes DIGIYLYFE.COM"
          git push
