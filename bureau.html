<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>DIGIY JOBS PRO — Alertes</title>
  <meta name="description" content="DIGIY JOBS PRO — bureau léger pour traiter les candidatures par alertes et actions." />
  <meta name="theme-color" content="#061b14" />

  <script>
    window.DIGIY_SUPABASE_URL = "https://wesqmwjjtsefyjnluosj.supabase.co";
    window.DIGIY_SUPABASE_ANON_KEY = "sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";
    window.DIGIY_SUPABASE_ANON = window.DIGIY_SUPABASE_ANON_KEY;
    window.DIGIY_MODULE = "JOBS";
    window.DIGIY_LOGIN_URL = "./pin.html";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./guard.js"></script>
  <script src="./claw-tools.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900;1000&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#061b14;
      --card:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.13);
      --text:#ecfff4;
      --muted:rgba(236,255,244,.72);
      --gold:#facc15;
      --gold2:#fde68a;
      --green:#22c55e;
      --blue:#38bdf8;
      --red:#fb7185;
      --shadow:0 22px 70px rgba(0,0,0,.34);
      --max:900px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(250,204,21,.11), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(56,189,248,.08), transparent 24%),
        linear-gradient(180deg,var(--bg),#030b08 100%);
    }

    body{
      padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(88px + env(safe-area-inset-bottom,0px));
    }

    a{text-decoration:none;color:inherit}
    button{font:inherit;cursor:pointer}

    .wrap{
      width:min(100%,var(--max));
      margin:0 auto;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-mark{
      width:46px;
      height:46px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--gold),#eab308);
      color:#171717;
      font-weight:1000;
      box-shadow:0 12px 28px rgba(0,0,0,.24);
      flex:0 0 auto;
    }

    .brand-title strong{
      display:block;
      font-size:18px;
      font-weight:1000;
      line-height:1.05;
    }

    .brand-title span{
      display:block;
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chip{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:10px 13px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      font-size:13px;
      font-weight:950;
      color:var(--text);
    }

    .chip.gold{
      color:#171717;
      background:linear-gradient(135deg,var(--gold),#eab308);
      border-color:transparent;
    }

    .hero{
      border:1px solid var(--line);
      border-radius:30px;
      background:
        radial-gradient(circle at 85% 12%, rgba(250,204,21,.13), transparent 24%),
        linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
      box-shadow:var(--shadow);
      padding:16px;
    }

    .kicker{
      color:var(--gold2);
      font-size:12px;
      letter-spacing:.13em;
      text-transform:uppercase;
      font-weight:1000;
    }

    h1{
      margin:9px 0 8px;
      font-size:clamp(30px,7vw,54px);
      line-height:.96;
      letter-spacing:-.045em;
    }

    .lead{
      margin:0;
      color:var(--muted);
      line-height:1.5;
      font-size:15px;
      font-weight:750;
    }

    .status{
      margin-top:12px;
      border:1px solid rgba(56,189,248,.22);
      background:rgba(56,189,248,.08);
      color:#d8f5ff;
      border-radius:20px;
      padding:12px 14px;
      line-height:1.45;
      font-size:13px;
      font-weight:850;
    }

    .status.ok{
      border-color:rgba(34,197,94,.25);
      background:rgba(34,197,94,.10);
      color:#c9ffd4;
    }

    .status.warn{
      border-color:rgba(250,204,21,.26);
      background:rgba(250,204,21,.10);
      color:#fff4bd;
    }

    .status.err{
      border-color:rgba(251,113,133,.26);
      background:rgba(251,113,133,.10);
      color:#ffd9df;
    }

    .filters{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:14px 0 4px;
      -webkit-overflow-scrolling:touch;
    }

    .filter{
      flex:0 0 auto;
      min-height:42px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 13px;
      font-weight:950;
    }

    .filter.active{
      background:rgba(250,204,21,.15);
      border-color:rgba(250,204,21,.30);
      color:#fff4bd;
    }

    .search{
      margin-top:10px;
    }

    .search input{
      width:100%;
      min-height:48px;
      border:none;
      outline:none;
      border-radius:18px;
      padding:0 14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--line);
      color:var(--text);
      font-weight:800;
    }

    .search input::placeholder{
      color:rgba(236,255,244,.44);
    }

    .cards{
      display:grid;
      gap:12px;
      margin-top:14px;
    }

    .card{
      border:1px solid var(--line);
      border-radius:26px;
      background:var(--card);
      box-shadow:var(--shadow);
      padding:14px;
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .name{
      margin:0;
      font-size:20px;
      line-height:1.08;
      font-weight:1000;
      letter-spacing:-.02em;
    }

    .meta{
      margin:5px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      font-weight:750;
    }

    .badge{
      flex:0 0 auto;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      padding:8px 10px;
      font-size:11px;
      font-weight:1000;
      color:#fff4bd;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:12px;
    }

    .btn{
      min-height:44px;
      border:none;
      border-radius:16px;
      padding:10px 11px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:rgba(255,255,255,.08);
      color:var(--text);
      font-weight:950;
    }

    .btn.primary{
      background:linear-gradient(135deg,var(--gold),#eab308);
      color:#151515;
    }

    .btn.green{
      background:rgba(34,197,94,.14);
      color:#c9ffd4;
      border:1px solid rgba(34,197,94,.22);
    }

    .btn.blue{
      background:rgba(56,189,248,.14);
      color:#d8f5ff;
      border:1px solid rgba(56,189,248,.22);
    }

    .btn.red{
      background:rgba(251,113,133,.13);
      color:#ffd9df;
      border:1px solid rgba(251,113,133,.22);
    }

    details{
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      background:rgba(255,255,255,.035);
      margin-top:12px;
      overflow:hidden;
    }

    summary{
      cursor:pointer;
      list-style:none;
      padding:12px 13px;
      font-weight:950;
      color:#fff4bd;
    }

    summary::-webkit-details-marker{display:none}

    .details-body{
      padding:0 13px 13px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      font-weight:750;
      white-space:pre-line;
    }

    .empty{
      border:1px dashed rgba(255,255,255,.18);
      border-radius:24px;
      padding:20px;
      text-align:center;
      color:var(--muted);
      font-weight:850;
      line-height:1.45;
      margin-top:14px;
    }

    .bottom-nav{
      position:fixed;
      left:50%;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));
      transform:translateX(-50%);
      width:min(680px,calc(100% - 18px));
      z-index:99;
      border:1px solid rgba(255,255,255,.13);
      border-radius:24px;
      background:rgba(6,27,20,.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      padding:8px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:6px;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .bottom-nav a{
      min-height:50px;
      border-radius:18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      font-size:11px;
      font-weight:950;
      color:rgba(236,255,244,.78);
      text-align:center;
    }

    .bottom-nav a.active{
      background:rgba(250,204,21,.14);
      color:#fff4bd;
      border:1px solid rgba(250,204,21,.22);
    }

    .bottom-nav b{
      font-size:18px;
      line-height:1;
    }

    @media (max-width:520px){
      .hero,.card{border-radius:24px}
      h1{font-size:34px}
      .lead{font-size:14px}
      .actions{grid-template-columns:1fr 1fr}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./index.html">
        <span class="brand-mark">JP</span>
        <span class="brand-title">
          <strong>DIGIY JOBS</strong>
          <span>Bureau d’alertes</span>
        </span>
      </a>

      <a class="chip gold" href="./pin.html">Code</a>
    </header>

    <main>
      <section class="hero">
        <div class="kicker">Alertes · candidats · actions</div>
        <h1>Traiter sans se disperser.</h1>
        <p class="lead">
          DIGIY remonte les dossiers. Le pro clique : appeler, sélectionner, retenir, classer.
        </p>

        <div id="statusBox" class="status">Ouverture du bureau JOBS…</div>
      </section>

      <div class="filters" aria-label="Filtres rapides">
        <button class="filter active" data-filter="all" type="button">Tous</button>
        <button class="filter" data-filter="new" type="button">🆕 Nouveaux</button>
        <button class="filter" data-filter="call" type="button">📞 À appeler</button>
        <button class="filter" data-filter="shortlist" type="button">⭐ Sélection</button>
        <button class="filter" data-filter="accepted" type="button">✅ Retenus</button>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Chercher nom, ville, métier…" />
      </div>

      <section id="cards" class="cards" aria-label="Candidatures"></section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navigation basse">
    <a href="./index.html"><b>◎</b>Actions</a>
    <a href="./publier-mission.html"><b>＋</b>Annonce</a>
    <a href="./cockpit.html"><b>🔔</b>Veille</a>
    <a class="active" href="./bureau.html"><b>📥</b>Bureau</a>
    <a href="./pin.html"><b>🔒</b>Code</a>
  </nav>

  <script>
    (() => {
      "use strict";

      const SENSITIVE_KEYS = [
        "slug",
        "phone",
        "tel",
        "jobs_tel",
        "owner_phone",
        "contact_phone",
        "module",
        "return",
        "from"
      ];

      const STORAGE = {
        SLUG: "digiy_jobs_slug",
        LAST_SLUG: "digiy_jobs_last_slug",
        PHONE: "digiy_jobs_phone"
      };

      const state = {
        offers: [],
        candidates: [],
        filter: "all",
        q: ""
      };

      const el = {
        statusBox: document.getElementById("statusBox"),
        cards: document.getElementById("cards"),
        searchInput: document.getElementById("searchInput")
      };

      function normSlug(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-]/g, "")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function normPhone(value) {
        const raw = String(value || "").trim();
        const cleaned = raw.replace(/[^\d+]/g, "");
        const digits = cleaned.replace(/[^\d]/g, "");
        if (!digits) return "";
        return cleaned.startsWith("+") ? `+${digits}` : digits;
      }

      function saveContext(slug, phone) {
        try {
          if (slug) {
            localStorage.setItem(STORAGE.SLUG, slug);
            localStorage.setItem(STORAGE.LAST_SLUG, slug);
            sessionStorage.setItem(STORAGE.SLUG, slug);
            sessionStorage.setItem(STORAGE.LAST_SLUG, slug);
          }

          if (phone) {
            localStorage.setItem(STORAGE.PHONE, phone);
            sessionStorage.setItem(STORAGE.PHONE, phone);
          }
        } catch (_) {}
      }

      function cleanVisibleUrl() {
        try {
          const url = new URL(window.location.href);

          const incomingSlug = normSlug(url.searchParams.get("slug") || "");
          const incomingPhone = normPhone(
            url.searchParams.get("phone") ||
            url.searchParams.get("tel") ||
            url.searchParams.get("jobs_tel") ||
            ""
          );

          saveContext(incomingSlug, incomingPhone);

          let changed = false;

          SENSITIVE_KEYS.forEach((key) => {
            if (url.searchParams.has(key)) {
              url.searchParams.delete(key);
              changed = true;
            }
          });

          if (changed) {
            history.replaceState({}, document.title, url.pathname + url.search + url.hash);
          }
        } catch (_) {}
      }

      function keepLinksClean() {
        document.querySelectorAll("a[href]").forEach((link) => {
          try {
            const href = link.getAttribute("href") || "";
            if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("https://wa.me/")) return;

            const url = new URL(href, window.location.href);
            if (url.origin !== window.location.origin) return;

            SENSITIVE_KEYS.forEach((key) => url.searchParams.delete(key));

            const file = url.pathname.split("/").pop() || "index.html";
            link.setAttribute("href", `./${file}${url.search || ""}${url.hash || ""}`);
          } catch (_) {}
        });
      }

      function setStatus(text, type) {
        el.statusBox.textContent = text;
        el.statusBox.className = "status" + (type ? " " + type : "");
      }

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function statusLabel(status) {
        const s = String(status || "new").toLowerCase();

        return {
          new: "Nouveau",
          review: "En lecture",
          shortlist: "Sélection",
          call: "À appeler",
          accepted: "Retenu",
          rejected: "Classé"
        }[s] || "Nouveau";
      }

      function offerTitle(candidate) {
        const offer = state.offers.find((item) => String(item.id) === String(candidate.offer_id));
        return offer?.title || candidate.job_title || candidate.trade || "Mission";
      }

      function waLink(candidate) {
        const phone = normPhone(candidate.phone || "");
        const title = offerTitle(candidate);

        const msg = [
          "Bonjour " + (candidate.full_name || ""),
          "je vous contacte pour votre candidature DIGIY JOBS.",
          "Mission : " + title + "."
        ].join(" ");

        if (!phone) return "#";

        return "https://wa.me/" + phone.replace(/^\+/, "") + "?text=" + encodeURIComponent(msg);
      }

      function filteredCandidates() {
        const q = String(state.q || "").trim().toLowerCase();

        return state.candidates.filter((candidate) => {
          const status = String(candidate.status || "new").toLowerCase();

          if (state.filter !== "all" && status !== state.filter) return false;

          if (q) {
            const hay = [
              candidate.full_name,
              candidate.phone,
              candidate.city,
              candidate.country,
              candidate.trade,
              candidate.job_title,
              candidate.availability,
              candidate.message,
              offerTitle(candidate)
            ].join(" ").toLowerCase();

            if (!hay.includes(q)) return false;
          }

          return true;
        });
      }

      function render() {
        const rows = filteredCandidates();

        if (!rows.length) {
          el.cards.innerHTML = `
            <div class="empty">
              Aucun dossier dans cette vue.<br>
              Le terrain est propre ou le filtre est trop serré.
            </div>
          `;
          return;
        }

        el.cards.innerHTML = rows.map((candidate) => {
          const name = candidate.full_name || "Candidat";
          const city = candidate.city || candidate.country || "Lieu à préciser";
          const title = offerTitle(candidate);
          const status = String(candidate.status || "new").toLowerCase();
          const phone = normPhone(candidate.phone || "");
          const message = candidate.message || "Aucun message détaillé.";
          const availability = candidate.availability || "Disponibilité à préciser";
          const experience = candidate.years_experience || "Expérience à préciser";

          return `
            <article class="card" data-id="${esc(candidate.id)}">
              <div class="card-top">
                <div>
                  <h2 class="name">${esc(name)}</h2>
                  <div class="meta">${esc(title)} · ${esc(city)}</div>
                </div>
                <span class="badge">${esc(statusLabel(status))}</span>
              </div>

              <div class="actions">
                <a class="btn primary" href="${esc(waLink(candidate))}" target="_blank" rel="noopener">💬 WhatsApp</a>
                <button class="btn blue" type="button" data-action="call" data-id="${esc(candidate.id)}">📞 À appeler</button>
                <button class="btn" type="button" data-action="shortlist" data-id="${esc(candidate.id)}">⭐ Sélection</button>
                <button class="btn green" type="button" data-action="accepted" data-id="${esc(candidate.id)}">✅ Retenir</button>
                <button class="btn red" type="button" data-action="rejected" data-id="${esc(candidate.id)}">Classer</button>
                <button class="btn" type="button" data-action="review" data-id="${esc(candidate.id)}">👁️ En lecture</button>
              </div>

              <details>
                <summary>Voir détails</summary>
                <div class="details-body">Téléphone : ${phone ? esc(phone) : "non renseigné"}
Disponibilité : ${esc(availability)}
Expérience : ${esc(experience)}

Message :
${esc(message)}</div>
              </details>
            </article>
          `;
        }).join("");

        keepLinksClean();
      }

      async function setCandidateStatus(id, status) {
        if (!id || !status) return;

        try {
          setStatus("Mise à jour du dossier…");

          if (!window.DIGIY_CLAW_JOBS || typeof window.DIGIY_CLAW_JOBS.setCandidateStatus !== "function") {
            setStatus("Outil JOBS indisponible. Recharge la page.", "warn");
            return;
          }

          const res = await window.DIGIY_CLAW_JOBS.setCandidateStatus(id, status);

          if (!res || !res.ok) {
            setStatus(res?.error || "Impossible de modifier le statut.", "err");
            return;
          }

          state.candidates = state.candidates.map((candidate) => {
            if (String(candidate.id) !== String(id)) return candidate;
            return { ...candidate, status };
          });

          render();
          setStatus("Dossier mis à jour. Le terrain reste propre.", "ok");
        } catch (err) {
          console.error(err);
          setStatus("Erreur pendant la mise à jour.", "err");
        }
      }

      function bind() {
        document.querySelectorAll(".filter").forEach((button) => {
          button.addEventListener("click", () => {
            document.querySelectorAll(".filter").forEach((b) => b.classList.remove("active"));
            button.classList.add("active");
            state.filter = button.dataset.filter || "all";
            render();
          });
        });

        el.searchInput.addEventListener("input", () => {
          state.q = el.searchInput.value || "";
          render();
        });

        el.cards.addEventListener("click", (event) => {
          const button = event.target.closest("[data-action][data-id]");
          if (!button) return;

          setCandidateStatus(button.dataset.id, button.dataset.action);
        });
      }

      async function boot() {
        cleanVisibleUrl();
        keepLinksClean();
        bind();

        try {
          if (window.DIGIY_GUARD && typeof window.DIGIY_GUARD.ready === "function") {
            const session = await window.DIGIY_GUARD.ready();

            if (!session || !session.access_ok) {
              setStatus("Code demandé. Ouvre ton accès JOBS pour traiter les dossiers.", "warn");
              return;
            }
          }

          if (!window.DIGIY_CLAW_JOBS || typeof window.DIGIY_CLAW_JOBS.fetchAll !== "function") {
            setStatus("Outil JOBS indisponible. Vérifie claw-tools.js.", "warn");
            return;
          }

          const data = await window.DIGIY_CLAW_JOBS.fetchAll();

          if (!data || !data.ok) {
            setStatus(data?.error || "Aucune donnée chargée.", "warn");
            return;
          }

          state.offers = Array.isArray(data.offers) ? data.offers : [];
          state.candidates = Array.isArray(data.candidates) ? data.candidates : [];

          render();

          setStatus(
            state.candidates.length
              ? `${state.candidates.length} dossier(s) à traiter.`
              : "Aucun dossier à traiter pour l’instant.",
            "ok"
          );
        } catch (err) {
          console.error(err);
          setStatus("Bureau léger ouvert. Recharge ou entre ton code si besoin.", "warn");
        }
      }

      boot();
    })();
  </script>
</body>
