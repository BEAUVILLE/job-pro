<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./index.html">

    </header>

    <main>
      <section class="hero">
        <div class="kicker">Match · mission · candidat</div>
        <h1>Voir le bon lien.</h1>
        <p class="lead">
          DIGIY rapproche les profils et les missions. Le pro décide.
        </p>

        <div id="statusBox" class="status">Ouverture du rapprochement JOBS…</div>
      </section>

      <div class="tools">
        <input id="searchInput" type="search" placeholder="Chercher nom, métier, ville…" />
        <select id="filterSelect">
          <option value="all">Tous</option>
          <option value="new">Nouveaux</option>
          <option value="call">À appeler</option>
          <option value="shortlist">Sélection</option>
          <option value="accepted">Retenus</option>
        </select>

    <a href="./index.html"><b>◎</b>Actions</a>

    <a href="./bureau.html"><b>📥</b>Bureau</a>

    <a href="./pin.html"><b>🔒</b>Code</a>
  </nav>

  <script>
    (() => {
      "use strict";

      const SENSITIVE_KEYS = [
        "slug",
        "phone",
        "tel",
        "jobs_tel",
        "owner_phone",
        "contact_phone",
        "module",
        "return",
        "from"
      ];

      const STORAGE = {
        SLUG: "digiy_jobs_slug",
        LAST_SLUG: "digiy_jobs_last_slug",
        PHONE: "digiy_jobs_phone"
      };

      const state = {
        offers: [],
        candidates: [],
        q: "",
        filter: "all"
      };

      const el = {
        statusBox: document.getElementById("statusBox"),
        cards: document.getElementById("cards"),
        searchInput: document.getElementById("searchInput"),
        filterSelect: document.getElementById("filterSelect")
      };

      function normSlug(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "-")
          .replace(/[^a-z0-9-]/g, "")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function normPhone(value) {
        const raw = String(value || "").trim();
        const cleaned = raw.replace(/[^\d+]/g, "");
        const digits = cleaned.replace(/[^\d]/g, "");
        if (!digits) return "";
        return cleaned.startsWith("+") ? `+${digits}` : digits;
      }

      function saveContext(slug, phone) {
        try {
          if (slug) {
            localStorage.setItem(STORAGE.SLUG, slug);
            localStorage.setItem(STORAGE.LAST_SLUG, slug);
            sessionStorage.setItem(STORAGE.SLUG, slug);
            sessionStorage.setItem(STORAGE.LAST_SLUG, slug);
          }

          if (phone) {
            localStorage.setItem(STORAGE.PHONE, phone);
            sessionStorage.setItem(STORAGE.PHONE, phone);
          }
        } catch (_) {}
      }

      function cleanVisibleUrl() {
        try {
          const url = new URL(window.location.href);

          const incomingSlug = normSlug(url.searchParams.get("slug") || "");
          const incomingPhone = normPhone(
            url.searchParams.get("phone") ||
            url.searchParams.get("tel") ||
            url.searchParams.get("jobs_tel") ||
            ""
          );

          saveContext(incomingSlug, incomingPhone);

          let changed = false;

          SENSITIVE_KEYS.forEach((key) => {
            if (url.searchParams.has(key)) {
              url.searchParams.delete(key);
              changed = true;
            }
          });

          if (changed) {
            history.replaceState({}, document.title, url.pathname + url.search + url.hash);
          }
        } catch (_) {}
      }

      function keepLinksClean() {
        document.querySelectorAll("a[href]").forEach((link) => {
          try {
            const href = link.getAttribute("href") || "";
            if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("https://wa.me/")) return;

            const url = new URL(href, window.location.href);
            if (url.origin !== window.location.origin) return;

            SENSITIVE_KEYS.forEach((key) => url.searchParams.delete(key));

            const file = url.pathname.split("/").pop() || "index.html";
            link.setAttribute("href", `./${file}${url.search || ""}${url.hash || ""}`);
          } catch (_) {}
        });
      }

      function setStatus(text, type) {
        el.statusBox.textContent = text;
        el.statusBox.className = "status" + (type ? " " + type : "");
      }

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function lower(value) {
        return String(value || "").toLowerCase().trim();
      }

      function offerForCandidate(candidate) {
        if (candidate.offer_id) {
          const linked = state.offers.find((offer) => String(offer.id) === String(candidate.offer_id));
          if (linked) return linked;
        }

        const words = lower([
          candidate.job_title,
          candidate.trade,
          candidate.message,
          candidate.city
        ].join(" "));

        const byText = state.offers.find((offer) => {
          const hay = lower([
            offer.title,
            offer.sector,
            offer.city,
            offer.description,
            offer.requirements
          ].join(" "));

          if (!hay) return false;

          return words.split(/\s+/).filter(Boolean).some((word) => {
            return word.length > 4 && hay.includes(word);
          });
        });

        return byText || state.offers[0] || null;
      }

      function scoreMatch(candidate, offer) {
        if (!candidate || !offer) return 40;

        let score = 45;

        const cCity = lower(candidate.city || "");
        const oCity = lower(offer.city || "");

        if (cCity && oCity && cCity === oCity) score += 20;

        const cText = lower([
          candidate.job_title,
          candidate.trade,
          candidate.message
        ].join(" "));

        const oText = lower([
          offer.title,
          offer.sector,
          offer.description,
          offer.requirements
        ].join(" "));

        const common = cText
          .split(/\s+/)
          .filter((word) => word.length > 4 && oText.includes(word));

        score += Math.min(common.length * 8, 25);

        const status = lower(candidate.status || "new");
        if (status === "shortlist" || status === "call") score += 8;
        if (status === "accepted") score += 12;

        return Math.max(35, Math.min(98, score));
      }

      function waLink(candidate, offer) {
        const phone = normPhone(candidate.phone || "");

        if (!phone) return "#";

        const msg = [
          "Bonjour " + (candidate.full_name || ""),
          "je vous contacte pour votre candidature DIGIY JOBS.",
          offer?.title ? "Mission : " + offer.title + "." : "J’ai une mission à vous proposer."
        ].join(" ");

        return "https://wa.me/" + phone.replace(/^\+/, "") + "?text=" + encodeURIComponent(msg);
      }

      function buildMatches() {
        return state.candidates.map((candidate) => {
          const offer = offerForCandidate(candidate);
          return {
            candidate,
            offer,
            score: scoreMatch(candidate, offer)
          };
        }).sort((a, b) => b.score - a.score);
      }

      function filteredMatches() {
        const q = lower(state.q);
        const statusFilter = lower(state.filter);

        return buildMatches().filter((item) => {
          const candidate = item.candidate;
          const offer = item.offer;
          const status = lower(candidate.status || "new");

          if (statusFilter !== "all" && status !== statusFilter) return false;

          if (q) {
            const hay = lower([
              candidate.full_name,
              candidate.phone,
              candidate.city,
              candidate.country,
              candidate.trade,
              candidate.job_title,
              candidate.availability,
              candidate.message,
              offer?.title,
              offer?.city,
              offer?.sector
            ].join(" "));

            if (!hay.includes(q)) return false;
          }

          return true;
        });
      }

      function render() {
        const rows = filteredMatches();

        if (!rows.length) {
          el.cards.innerHTML = `
            <div class="empty">
              Aucun rapprochement dans cette vue.<br>
              Crée une mission ou attends une candidature.
            </div>
          `;
          return;
        }

        el.cards.innerHTML = rows.map((item) => {
          const candidate = item.candidate;
          const offer = item.offer;

          const name = candidate.full_name || "Candidat";
          const city = candidate.city || candidate.country || "Lieu à préciser";
          const trade = candidate.trade || candidate.job_title || "Métier à préciser";
          const offerTitle = offer?.title || "Mission à préciser";
          const offerCity = offer?.city || "Ville à préciser";
          const status = candidate.status || "new";
          const score = item.score;

          return `
            <article class="match-card" data-id="${esc(candidate.id)}">
              <div class="match-top">
                <div>
                  <h2 class="match-title">${esc(name)}</h2>
                  <div class="match-meta">${esc(trade)} · ${esc(city)}</div>
                </div>
                <span class="score">${score}%</span>
              </div>

              <div class="link-line">
                <strong>🎯 ${esc(offerTitle)}</strong>
                <span>${esc(offerCity)} · statut candidat : ${esc(status)}</span>
              </div>

              <div class="actions">
                <a class="btn primary" href="${esc(waLink(candidate, offer))}" target="_blank" rel="noopener">💬 WhatsApp</a>
                <button class="btn green" type="button" data-action="shortlist" data-id="${esc(candidate.id)}">⭐ Sélection</button>
                <button class="btn blue" type="button" data-action="call" data-id="${esc(candidate.id)}">📞 À appeler</button>
                <a class="btn" href="./bureau.html">Ouvrir bureau</a>
              </div>

              <details>
                <summary>Voir pourquoi</summary>
                <div class="details-body">Candidat :
${esc(name)}
Métier : ${esc(trade)}
Ville : ${esc(city)}

Mission proposée :
${esc(offerTitle)}
Ville mission : ${esc(offerCity)}

DIGIY propose le rapprochement. Le pro valide avec sa vérité.</div>
              </details>
            </article>
          `;
        }).join("");

        keepLinksClean();
      }

      async function setCandidateStatus(id, status) {
        if (!id || !status) return;

        try {
          setStatus("Mise à jour du rapprochement…");

          if (!window.DIGIY_CLAW_JOBS || typeof window.DIGIY_CLAW_JOBS.setCandidateStatus !== "function") {
            setStatus("Outil JOBS indisponible. Recharge la page.", "warn");
            return;
          }

          const res = await window.DIGIY_CLAW_JOBS.setCandidateStatus(id, status);

          if (!res || !res.ok) {
            setStatus(res?.error || "Impossible de modifier le statut.", "err");
            return;
          }

          state.candidates = state.candidates.map((candidate) => {
            if (String(candidate.id) !== String(id)) return candidate;
            return { ...candidate, status };
          });

          render();
          setStatus("Rapprochement gardé. Le terrain décide.", "ok");
        } catch (err) {
          console.error(err);
          setStatus("Erreur pendant la mise à jour.", "err");
        }
      }

      function bind() {
        el.searchInput.addEventListener("input", () => {
          state.q = el.searchInput.value || "";
          render();
        });

        el.filterSelect.addEventListener("change", () => {
          state.filter = el.filterSelect.value || "all";
          render();
        });

        el.cards.addEventListener("click", (event) => {
          const button = event.target.closest("[data-action][data-id]");
          if (!button) return;

          setCandidateStatus(button.dataset.id, button.dataset.action);
        });
      }

      async function boot() {
        cleanVisibleUrl();
        keepLinksClean();
        bind();

        try {
          if (window.DIGIY_GUARD && typeof window.DIGIY_GUARD.ready === "function") {
            const session = await window.DIGIY_GUARD.ready();

            if (!session || !session.access_ok) {
              setStatus("Code demandé. Ouvre ton accès JOBS pour voir les rapprochements.", "warn");
              return;
            }
          }

          if (!window.DIGIY_CLAW_JOBS || typeof window.DIGIY_CLAW_JOBS.fetchAll !== "function") {
            setStatus("Outil JOBS indisponible. Vérifie claw-tools.js.", "warn");
            return;
          }

          const data = await window.DIGIY_CLAW_JOBS.fetchAll();

          if (!data || !data.ok) {
            setStatus(data?.error || "Aucune donnée chargée.", "warn");
            return;
          }

          state.offers = Array.isArray(data.offers) ? data.offers : [];
          state.candidates = Array.isArray(data.candidates) ? data.candidates : [];

          render();

          setStatus(
            state.candidates.length
              ? `${state.candidates.length} profil(s) à rapprocher.`
              : "Aucun profil à rapprocher pour l’instant.",
            "ok"
          );
        } catch (err) {
          console.error(err);
          setStatus("Rapprochement léger ouvert. Recharge ou entre ton code si besoin.", "warn");
        }
      }

      boot();
    })();
  </script>
</body>
</html>
