<style>
:root{--bg:#061b14;--bg2:#0b2a1e;--gold:#facc15;--green:#22c55e;--ink:#effff5;--muted:rgba(239,255,245,.72);--line:rgba(255,255,255,.15)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(700px 400px at 10% -5%,rgba(250,204,21,.16),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));display:grid;place-items:center}
main{width:min(580px,100%);padding:20px;border:1px solid rgba(250,204,21,.26);border-radius:28px;background:rgba(255,255,255,.065);box-shadow:0 24px 65px rgba(0,0,0,.34);text-align:center}
.kicker{color:#fde68a;font-size:12px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
h1{margin:8px 0 8px;font-size:clamp(38px,9vw,62px);line-height:.94}
p{color:var(--muted);font-weight:800;line-height:1.5}
.qr{margin:18px auto;padding:14px;border-radius:24px;background:#fff;width:min(360px,100%)}
.qr img{display:block;width:100%;height:auto}
.url{margin:12px 0;padding:11px;border-radius:15px;background:rgba(0,0,0,.22);color:#dbeafe;font-size:13px;font-weight:850;word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions a,.actions button{min-height:52px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:1000;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer}
.actions .main{border:0;background:linear-gradient(135deg,var(--gold),var(--green));color:#061b14}
.note{margin-top:12px;padding:11px;border:1px solid rgba(34,197,94,.28);border-radius:15px;background:rgba(34,197,94,.10);color:#bbf7d0;font-weight:900;line-height:1.45}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style>

<body>
<main>
<div class="kicker">PRO JOB · QR public</div>
<h1>Mon QR JOBS</h1>
<p>Le QR ouvre le mur public des missions. Aucun PIN, téléphone ou identifiant interne n’apparaît dans le lien.</p>
<div class="qr"><img id="qrImg" alt="QR public DIGIY JOBS"></div>
<div class="url" id="urlBox"></div>
<div class="actions">
<a class="main" id="openPublic" href="#" target="_blank" rel="noopener noreferrer">Ouvrir les missions</a>
<button id="copyBtn" type="button">Copier le lien</button>
<button id="shareBtn" type="button">Partager</button>
<a href="./index.html">Retour PRO JOB</a>
</div>
<div class="note" id="note">Préparation du QR…</div>
</main>
<script>
(async()=>{
"use strict";
const PUBLIC_BASE="https://jobs.digiylyfe.com/";
const PUBLIC_MISSIONS=new URL("missions.html",PUBLIC_BASE).toString();
const $=id=>document.getElementById(id);
const sensitive=["slug","phone","tel","owner_phone","contact_phone","pin","code","token","session","access","module","offer","id"];
function cleanUrl(){try{const u=new URL(location.href);let changed=false;sensitive.forEach(k=>{if(u.searchParams.has(k)){u.searchParams.delete(k);changed=true}});if(changed)history.replaceState({},document.title,u.pathname+u.search+u.hash)}catch(_){}}
function qrUrl(value){return "https://api.qrserver.com/v1/create-qr-code/?size=720x720&margin=18&data="+encodeURIComponent(value)}
async function copy(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
cleanUrl();
try{
  const session=await window.DIGIY_GUARD.ready({redirect:true});
  if(!session?.access_ok)return;
  document.documentElement.style.visibility="";
  $("qrImg").src=qrUrl(PUBLIC_MISSIONS);
  $("urlBox").textContent=PUBLIC_MISSIONS;
  $("openPublic").href=PUBLIC_MISSIONS;
  $("copyBtn").onclick=async()=>{try{await copy(PUBLIC_MISSIONS);$("note").textContent="Lien public copié."}catch(_){$("note").textContent=PUBLIC_MISSIONS}};
  $("shareBtn").onclick=()=>{
    const text="Voir les missions DIGIY JOBS : "+PUBLIC_MISSIONS;
    if(navigator.share){navigator.share({title:"DIGIY JOBS",text,url:PUBLIC_MISSIONS}).catch(()=>{})}
    else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener");
  };
  $("qrImg").onerror=()=>{$("note").textContent="Le service image QR ne répond pas. Le lien public reste utilisable."};
  $("note").textContent="✅ QR prêt vers le vrai domaine public JOBS.";
}catch(error){
  console.error("[JOBS QR]",error);
  location.replace("./pin.html");
}
})();
</script>
</body>
